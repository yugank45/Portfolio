<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Deep Obsidian Tile Gradient -->
    <linearGradient id="bgGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#190a19"/>
      <stop offset="45%" stop-color="#0e040f"/>
      <stop offset="100%" stop-color="#050205"/>
    </linearGradient>

    <!-- Electric Amber-to-Crimson Neon Rim -->
    <linearGradient id="rimGrad" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7b2b" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ff3b30" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#ff2a5f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Specular Glass Highlight Overlay -->
    <linearGradient id="specularGleam" x1="120" y1="20" x2="390" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Signature Y Monogram Vibrant Gradient -->
    <linearGradient id="yMonogramGrad" x1="140" y1="120" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffb84d"/>
      <stop offset="25%" stop-color="#ff6b00"/>
      <stop offset="65%" stop-color="#ff3344"/>
      <stop offset="100%" stop-color="#ff2a5f"/>
    </linearGradient>

    <!-- Ambient Core Radial Glow -->
    <radialGradient id="ambientAura" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#ff5520" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#ff2a5f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Brand Dot Gradient -->
    <radialGradient id="dotGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="35%" stop-color="#ff7b2b"/>
      <stop offset="100%" stop-color="#ff2a5f"/>
    </radialGradient>

    <!-- High-Impact Neon Glow Filter -->
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Soft Dot Bloom -->
    <filter id="dotBloom" x="-60%" y="-60%" width="220%" height="220%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle with Dark Obsidian Aesthetic -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#bgGrad)"/>
  
  <!-- Ambient Core Glow -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#ambientAura)"/>

  <!-- Top Glass Highlight Specular Arc -->
  <path d="M24 140 C24 75.9 75.9 24 140 24 H372 C436.1 24 488 75.9 488 140 V175 C420 195 330 170 230 200 C130 230 50 185 24 175 Z" 
        fill="url(#specularGleam)"/>

  <!-- Radiant Neon Border Rim -->
  <rect x="20" y="20" width="472" height="472" rx="124" stroke="url(#rimGrad)" stroke-width="6"/>

  <!-- Master Architectural "Y" Monogram -->
  <path d="M 144 144
           C 136 132 144 118 158 118
           C 166 118 174 122 179 130
           L 256 238
           L 333 130
           C 338 122 346 118 354 118
           C 368 118 376 132 368 144
           L 282 264
           C 278 270 276 277 276 284
           V 384
           C 276 395 267 404 256 404
           C 245 404 236 395 236 384
           V 284
           C 236 277 234 270 230 264
           Z"
        fill="url(#yMonogramGrad)"
        filter="url(#neonBloom)"/>

  <!-- Core Facet Crisp Lettermark Overlay (Ensures perfect optical crispness at small sizes) -->
  <path d="M 144 144
           C 136 132 144 118 158 118
           C 166 118 174 122 179 130
           L 256 238
           L 333 130
           C 338 122 346 118 354 118
           C 368 118 376 132 368 144
           L 282 264
           C 278 270 276 277 276 284
           V 384
           C 276 395 267 404 256 404
           C 245 404 236 395 236 384
           V 284
           C 236 277 234 270 230 264
           Z"
        fill="url(#yMonogramGrad)"/>

  <!-- Signature Glowing Brand Dot (Matching navbar logo: Yugank Singh ●) -->
  <circle cx="396" cy="118" r="46" fill="#ff5520" opacity="0.3" filter="url(#dotBloom)"/>
  <circle cx="396" cy="118" r="30" fill="url(#dotGrad)" filter="url(#dotBloom)"/>
  <circle cx="396" cy="118" r="14" fill="#ffffff" opacity="0.85"/>
</svg>
